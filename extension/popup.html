<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <span id="status">…</span>
  </header>

  <section>
    <h3>Sessions (ChatGPT tabs)</h3>
    <table id="sessions">
      <thead><tr><th>Session</th><th>Page</th><th>Server view</th><th>Inflight</th><th>Page policy</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h3>Recent tasks</h3>
    <table id="tasks">
      <thead><tr><th>ID</th><th>Session</th><th>Status</th><th>Time</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section>
    <h3>Config</h3>
    <p id="dispatchStatus" role="status"></p>
    <p id="capacityStatus"></p>
    <label>Managed tab limit <input id="maxManagedTabs" type="number" min="1" max="100" value="6"></label>
    <button id="saveCapacity">Save limit</button>
    <p class="hint">Protected tabs stay open. Reclaimable tabs may close when idle to make room for queued work.</p>
    <p id="actionError" role="alert" hidden></p>
    <label>Relay URL <input id="baseUrl" type="text" size="30"></label>
    <button id="saveUrl">Save</button>
    <div style="margin-top: 6px">
      <button id="pollNow">Poll now</button>
      <button id="clearInflight">Clear inflight</button>
    </div>
  </section>

  <section id="lastErrorSection" hidden>
    <h3>Last error</h3>
    <pre id="lastError"></pre>
  </section>

  <script src="popup.js"></script>
</body>
</html>
